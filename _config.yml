resume_header_intro: "<p>NLP and LLM researcher specializing in LLM interpretability and small language models. My research explores how knowledge and reasoning are represented within large language models and how these capabilities can be effectively transferred to smaller models through knowledge distillation. Ultimately, I aim to develop more capable and efficient small language models by connecting model understanding with practical optimization methods.
</p>"

